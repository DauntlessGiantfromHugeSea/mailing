services:
  db:
    image: postgres:16-alpine
    container_name: mailing-db
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bitte in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-mailing}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailing} -d ${POSTGRES_DB:-mailing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: { context: ., dockerfile: Dockerfile }
    image: mailing:latest
    container_name: mailing-app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    # Gibt ALLE Werte der .env an den Container weiter. Ohne das erreicht nur,
    # was unten unter environment: steht, den Prozess - eine neue Variable in
    # der .env wäre sonst wirkungslos, ohne dass es auffällt.
    # environment: hat Vorrang, DATABASE_URL unten bleibt also maßgeblich.
    env_file: [.env]
    environment: &app_env
      DATABASE_URL: "postgresql://${POSTGRES_USER:-mailing}:${POSTGRES_PASSWORD}@mailing-db:5432/${POSTGRES_DB:-mailing}?schema=public"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?bitte in .env setzen (64 Hex-Zeichen)}
      SESSION_SECRET: ${SESSION_SECRET:?bitte in .env setzen (min. 32 Zeichen)}
      # Muss die öffentliche HTTPS-Adresse sein — landet in den Abmeldelinks.
      APP_URL: ${APP_URL:?bitte in .env setzen, z.B. https://mailing.example.com}
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Anmeldung über Microsoft Entra ID. Alle drei leer = nur Passwort-Login.
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_ALLOWED_DOMAINS: ${MICROSOFT_ALLOWED_DOMAINS:-}
      MICROSOFT_AUTO_PROVISION: ${MICROSOFT_AUTO_PROVISION:-}
      MICROSOFT_DEFAULT_ROLE: ${MICROSOFT_DEFAULT_ROLE:-VIEWER}
      # "false" schaltet die Passwortanmeldung ab - erst setzen, wenn die
      # Microsoft-Anmeldung nachweislich funktioniert.
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-}
      NODE_ENV: production
      # Beim allerersten Start auf 1 setzen, danach wieder entfernen.
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}   # kein Standardpasswort (Sicherheits-Audit)
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
    # Nur auf localhost gebunden: der Zugriff von außen läuft über den Proxy.
    # Zum Debuggen:  curl -I http://127.0.0.1:3000/login
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks: [internal]

  # Eigener Prozess, damit der Versand nicht von HTTP-Requests abhängt.
  # Nur EINE Instanz betreiben — das DB-Lock verhindert Doppelversand, aber
  # mehrere Worker bringen keinen Nutzen, da bewusst sequenziell gesendet wird.
  worker:
    image: mailing:latest
    container_name: mailing-worker
    restart: unless-stopped
    depends_on:
      app: { condition: service_started }
      db: { condition: service_healthy }
    env_file: [.env]
    environment: *app_env
    command: ["node", "dist/worker/main.js"]
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Reverse Proxy mit automatischem Let's-Encrypt-Zertifikat.
  #
  # Nur aktiv, wenn ausdrücklich angefordert:
  #     docker compose --profile caddy up -d
  #
  # Läuft auf dem Server schon ein Webserver auf Port 80/443, würde dieser
  # Container beim Start mit "address already in use" scheitern. Dann NICHT das
  # Profil benutzen, sondern den vorhandenen Proxy auf 127.0.0.1:3000 zeigen
  # lassen — siehe DEPLOY.md, Variante B.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: mailing-caddy
    restart: unless-stopped
    profiles: [caddy]
    depends_on:
      app: { condition: service_started }
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?bitte in .env setzen, z.B. mailing.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Zertifikate — dieses Volume nicht löschen
      - caddy_config:/config
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
